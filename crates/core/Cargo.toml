[package]
name = "enclavedns-core"
description = "EnclaveDNS client core: a DoH stub resolver for EnclaveDNS, and .eth sites through local IPFS, Swarm, Arweave and Tor over HTTPS"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
hickory-proto = { version = "0.24", default-features = false }
tokio-socks = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
toml = "0.8"
