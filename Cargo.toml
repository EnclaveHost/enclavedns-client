[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "android/rust"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/EnclaveHost/enclavedns-client"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
